<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lukas-PC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Desktop -->
  <div id="desktop">

    <!-- Desktop icons -->
    <div class="desktop-icons">

      <!-- Folder: Fotky a videa -->
      <div class="icon" data-app="folder-photos">
        <img src="assets/icons/folder.svg" alt="složka" />
        <span>Fotky a videa</span>
      </div>

      <!-- App: Chrome -->
      <div class="icon" data-app="chrome">
        <img src="assets/icons/chrome.svg" alt="Chrome" />
        <span>Google Chrome</span>
      </div>

      <!-- App: Discord -->
      <div class="icon" data-app="discord">
        <img src="assets/icons/discord.svg" alt="Discord" />
        <span>Discord</span>
      </div>

      <!-- App: Halo -->
      <div class="icon" data-app="halo">
        <img src="assets/icons/halo.svg" alt="Halo" />
        <span>Halo Infinite</span>
      </div>

      <!-- App: Counter-Strike -->
      <div class="icon" data-app="cs">
        <img src="assets/icons/cs.svg" alt="Counter-Strike" />
        <span>Counter-Strike 2</span>
      </div>

      <!-- Recycle Bin -->
      <div class="icon" data-app="recycle">
        <img src="assets/icons/recycle.svg" alt="Koš" />
        <span>Koš</span>
      </div>

    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0h11v11H0zm13 0h11v11H13zM0 13h11v11H0zm13 0h11v11H13z" fill="currentColor"/>
        </svg>
      </button>
      <div id="taskbar-apps"></div>
      <div id="taskbar-right">
        <span id="taskbar-time"></span>
      </div>
    </div>

  </div>

  <!-- Chrome browser window -->
  <div id="chrome-window" class="hidden">
    <div class="chrome-titlebar">
      <div class="chrome-traffic-lights"><span></span><span></span><span></span></div>
      <div class="chrome-tabbar" id="chrome-tabbar"></div>
      <button class="chrome-close" id="chrome-close-btn">✕</button>
    </div>
    <div class="chrome-toolbar">
      <div class="chrome-nav-btns">
        <span class="chrome-nav-btn">‹</span>
        <span class="chrome-nav-btn">›</span>
        <span class="chrome-nav-btn">⟳</span>
      </div>
      <div class="chrome-address-bar">
        <svg class="chrome-lock-icon" viewBox="0 0 24 24" width="11" height="11">
          <path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/>
        </svg>
        <span id="chrome-address-text">chat.openai.com/c/6f2a91d0-8b3e-4c1a-9f2d-3a7e5c0b1d44</span>
      </div>
      <div class="chrome-toolbar-right">
        <button class="chrome-menu-btn" id="chrome-menu-btn">⋮</button>
        <div class="chrome-menu-dropdown hidden" id="chrome-menu-dropdown">
          <div class="chrome-menu-item" id="chrome-menu-history">
            <span>Historie</span><span class="chrome-menu-shortcut">Ctrl+H</span>
          </div>
          <div class="chrome-menu-item">Stažené soubory<span class="chrome-menu-shortcut">Ctrl+J</span></div>
          <div class="chrome-menu-item">Záložky</div>
          <div class="chrome-menu-sep"></div>
          <div class="chrome-menu-item">Nastavení</div>
        </div>
      </div>
    </div>
    <div class="chrome-bookmarks-bar" id="chrome-bookmarks-bar"></div>
    <div class="chrome-page" id="chrome-page"></div>
    <div class="chrome-statusbar hidden" id="chrome-statusbar"></div>
  </div>

  <!-- Modal: Update/Loading placeholder -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <button id="modal-close">Zavřít</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
