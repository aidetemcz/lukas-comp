<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lukas-PC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Desktop -->
  <div id="desktop">

    <!-- Desktop icons -->
    <div class="desktop-icons">

      <!-- Folder: Fotky a videa -->
      <div class="icon" data-app="folder-photos">
        <img src="assets/icons/folder.svg" alt="složka" />
        <span>Fotky a videa</span>
      </div>

      <!-- App: Chrome -->
      <div class="icon" data-app="chrome">
        <img src="assets/icons/chrome.svg" alt="Chrome" />
        <span>Google Chrome</span>
      </div>

      <!-- App: Discord -->
      <div class="icon" data-app="discord">
        <img src="assets/icons/discord.svg" alt="Discord" />
        <span>Discord</span>
      </div>

      <!-- App: Halo -->
      <div class="icon" data-app="halo">
        <img src="assets/icons/halo.svg" alt="Halo" />
        <span>Halo Infinite</span>
      </div>

      <!-- App: Counter-Strike -->
      <div class="icon" data-app="cs">
        <img src="assets/icons/cs.svg" alt="Counter-Strike" />
        <span>Counter-Strike 2</span>
      </div>

      <!-- Recycle Bin -->
      <div class="icon" data-app="recycle">
        <img src="assets/icons/recycle.svg" alt="Koš" />
        <span>Koš</span>
      </div>

    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0h11v11H0zm13 0h11v11H13zM0 13h11v11H0zm13 0h11v11H13z" fill="currentColor"/>
        </svg>
      </button>
      <div id="taskbar-apps"></div>
      <div id="taskbar-right">
        <span id="taskbar-time"></span>
      </div>
    </div>

  </div>

  <!-- Chrome browser window -->
  <div id="chrome-window" class="hidden">
    <div class="chrome-titlebar">
      <div class="chrome-traffic-lights"><span></span><span></span><span></span></div>
      <div class="chrome-tabbar" id="chrome-tabbar"></div>
      <button class="chrome-close" id="chrome-close-btn">✕</button>
    </div>
    <div class="chrome-toolbar">
      <div class="chrome-nav-btns">
        <span class="chrome-nav-btn">‹</span>
        <span class="chrome-nav-btn">›</span>
        <span class="chrome-nav-btn">⟳</span>
      </div>
      <div class="chrome-address-bar">
        <svg class="chrome-lock-icon" viewBox="0 0 24 24" width="11" height="11">
          <path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/>
        </svg>
        <span id="chrome-address-text">chat.openai.com/c/6f2a91d0-8b3e-4c1a-9f2d-3a7e5c0b1d44</span>
      </div>
      <div class="chrome-toolbar-right">
        <button class="chrome-menu-btn" id="chrome-menu-btn">⋮</button>
        <div class="chrome-menu-dropdown hidden" id="chrome-menu-dropdown">
          <div class="chrome-menu-item" id="chrome-menu-history">
            <span>Historie</span><span class="chrome-menu-shortcut">Ctrl+H</span>
          </div>
          <div class="chrome-menu-item">Stažené soubory<span class="chrome-menu-shortcut">Ctrl+J</span></div>
          <div class="chrome-menu-item">Záložky</div>
          <div class="chrome-menu-sep"></div>
          <div class="chrome-menu-item">Nastavení</div>
        </div>
      </div>
    </div>
    <div class="chrome-bookmarks-bar" id="chrome-bookmarks-bar"></div>
    <div class="chrome-page" id="chrome-page"></div>
    <div class="chrome-statusbar hidden" id="chrome-statusbar"></div>
  </div>

  <!-- Discord window -->
  <div id="discord-window" class="hidden">
    <div class="discord-titlebar">
      <img class="discord-titlebar-icon" src="assets/icons/discord.svg" alt="" />
      <span class="discord-titlebar-name">Discord</span>
      <button class="discord-close" id="discord-close-btn">✕</button>
    </div>
    <div class="discord-app">
      <div class="discord-server-rail" id="discord-server-rail"></div>
      <div class="discord-channel-panel">
        <div class="discord-channel-header" id="discord-server-name"></div>
        <div class="discord-channel-list" id="discord-channel-list"></div>
        <div class="discord-user-footer">
          <span class="discord-avatar discord-avatar-default" id="discord-self-avatar"></span>
          <div class="discord-user-footer-info">
            <span class="discord-user-footer-name">hidd3nfram3</span>
            <span class="discord-user-footer-status">online</span>
          </div>
        </div>
      </div>
      <div class="discord-main">
        <div class="discord-main-header" id="discord-main-header"></div>
        <div class="discord-messages" id="discord-messages"></div>
        <div class="discord-input" id="discord-input">
          <span class="discord-input-box" id="discord-input-box"></span>
        </div>
      </div>
      <div class="discord-member-panel" id="discord-member-panel"></div>
    </div>
  </div>

  <!-- Photos / File explorer window -->
  <div id="photos-window" class="hidden">
    <div class="explorer-titlebar">
      <img class="explorer-titlebar-icon" src="assets/icons/folder.svg" alt="" />
      <span class="explorer-titlebar-name">Fotky a videa</span>
      <button class="explorer-close" id="photos-close-btn">✕</button>
    </div>
    <div class="photos-toolbar">
      <button class="photos-back-btn" id="photos-back-btn">‹</button>
      <div class="photos-breadcrumb" id="photos-breadcrumb"></div>
    </div>
    <div class="photos-grid" id="photos-grid"></div>
  </div>

  <!-- Photos file-preview modal -->
  <div id="photos-modal-overlay" class="hidden">
    <div id="photos-modal">
      <div class="photos-modal-titlebar">
        <span id="photos-modal-name"></span>
        <button class="explorer-close" id="photos-modal-close">✕</button>
      </div>
      <div class="photos-modal-body">
        <div class="photos-modal-preview" id="photos-modal-preview"></div>
        <div class="photos-modal-meta" id="photos-modal-meta"></div>
      </div>
    </div>
  </div>

  <!-- Recycle Bin window -->
  <div id="recycle-window" class="hidden">
    <div class="explorer-titlebar">
      <img class="explorer-titlebar-icon" src="assets/icons/recycle.svg" alt="" />
      <span class="explorer-titlebar-name">Koš</span>
      <button class="explorer-close" id="recycle-close-btn">✕</button>
    </div>
    <div class="explorer-toolbar">
      <span class="explorer-toolbar-label">8 položek</span>
    </div>
    <div class="explorer-list-header">
      <span class="explorer-col-name">Název</span>
      <span class="explorer-col-date">Datum smazání</span>
      <span class="explorer-col-size">Velikost</span>
    </div>
    <div class="explorer-list" id="recycle-list"></div>
  </div>

  <!-- Trash file viewer window -->
  <div id="trash-viewer-window" class="hidden">
    <div class="explorer-titlebar">
      <img class="explorer-titlebar-icon" id="trash-viewer-icon" src="" alt="" />
      <span class="explorer-titlebar-name" id="trash-viewer-name"></span>
      <button class="explorer-close" id="trash-viewer-close-btn">✕</button>
    </div>
    <div class="trash-viewer-content" id="trash-viewer-content"></div>
  </div>

  <!-- Recycle bin context menu -->
  <div class="context-menu hidden" id="recycle-context-menu">
    <div class="context-menu-item" id="context-menu-open">Zobrazit</div>
    <div class="context-menu-item" id="context-menu-restore">Obnovit</div>
  </div>

  <!-- Modal: Update/Loading placeholder -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <button id="modal-close">Zavřít</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
