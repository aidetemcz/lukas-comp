<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lukas-PC</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Desktop -->
  <div id="desktop">

    <!-- Desktop icons -->
    <div class="desktop-icons">

      <!-- Folder: Fotky a videa -->
      <div class="icon" data-app="folder-photos">
        <img src="assets/icons/folder.svg" alt="složka" />
        <span>Fotky a videa</span>
      </div>

      <!-- App: Chrome -->
      <div class="icon" data-app="chrome">
        <img src="assets/icons/chrome.svg" alt="Chrome" />
        <span>Google Chrome</span>
      </div>

      <!-- App: Discord -->
      <div class="icon" data-app="discord">
        <img src="assets/icons/discord.svg" alt="Discord" />
        <span>Discord</span>
      </div>

      <!-- App: Halo -->
      <div class="icon" data-app="halo">
        <img src="assets/icons/halo.svg" alt="Halo" />
        <span>Halo Infinite</span>
      </div>

      <!-- App: Counter-Strike -->
      <div class="icon" data-app="cs">
        <img src="assets/icons/cs.svg" alt="Counter-Strike" />
        <span>Counter-Strike 2</span>
      </div>

      <!-- Recycle Bin -->
      <div class="icon" data-app="recycle">
        <img src="assets/icons/recycle.svg" alt="Koš" />
        <span>Koš</span>
      </div>

    </div>

    <!-- Taskbar -->
    <div id="taskbar">
      <button id="start-btn">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0h11v11H0zm13 0h11v11H13zM0 13h11v11H0zm13 0h11v11H13z" fill="currentColor"/>
        </svg>
      </button>
      <div id="taskbar-apps"></div>
      <div id="taskbar-right">
        <span id="taskbar-time"></span>
      </div>
    </div>

  </div>

  <!-- Chrome browser window -->
  <div id="chrome-window" class="hidden">
    <div class="chrome-titlebar">
      <div class="chrome-traffic-lights"><span></span><span></span><span></span></div>
      <div class="chrome-tabbar">
        <div class="chrome-tab active">
          <img class="chrome-tab-favicon" src="assets/icons/chatgpt.svg" alt="" />
          <span class="chrome-tab-title">ChatGPT</span>
        </div>
      </div>
      <button class="chrome-close" id="chrome-close-btn">✕</button>
    </div>
    <div class="chrome-toolbar">
      <div class="chrome-nav-btns">
        <span class="chrome-nav-btn">‹</span>
        <span class="chrome-nav-btn">›</span>
        <span class="chrome-nav-btn">⟳</span>
      </div>
      <div class="chrome-address-bar">
        <svg class="chrome-lock-icon" viewBox="0 0 24 24" width="11" height="11">
          <path fill="currentColor" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm3 8H9V6a3 3 0 0 1 6 0v3z"/>
        </svg>
        <span id="chrome-address-text">chat.openai.com/c/6f2a91d0-8b3e-4c1a-9f2d-3a7e5c0b1d44</span>
      </div>
    </div>
    <div class="chrome-page">
      <div id="chatgpt-app">
        <aside class="chatgpt-sidebar">
          <div class="chatgpt-sidebar-top">
            <div class="chatgpt-logo-row">
              <img class="chatgpt-logo-mark" src="assets/icons/chatgpt.svg" alt="" />
              <span class="chatgpt-logo-text">ChatGPT</span>
            </div>
            <button class="chatgpt-newchat-btn">
              <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 4v16m-8-8h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              Nový chat
            </button>
          </div>
          <div class="chatgpt-conv-list" id="chatgpt-conv-list"></div>
          <div class="chatgpt-sidebar-bottom">
            <div class="chatgpt-user-row">
              <span class="chatgpt-user-avatar">L</span>
              <span class="chatgpt-user-name">us4r.4O4</span>
            </div>
          </div>
        </aside>
        <main class="chatgpt-main">
          <div class="chatgpt-main-header">
            <span class="chatgpt-model-name">ChatGPT</span>
            <span class="chatgpt-conv-timestamp" id="chatgpt-conv-timestamp"></span>
          </div>
          <div class="chatgpt-messages" id="chatgpt-messages"></div>
        </main>
      </div>
    </div>
  </div>

  <!-- Modal: Update/Loading placeholder -->
  <div id="modal-overlay" class="hidden">
    <div id="modal">
      <div id="modal-title"></div>
      <div id="modal-body"></div>
      <button id="modal-close">Zavřít</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
